
services:
  postgres:
    image: postgres:16-alpine
    container_name: doublea-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: doublea
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: doublea_commerce
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doublea -d doublea_commerce"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: doublea-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@doublea.com
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?PGADMIN_DEFAULT_PASSWORD is required}
    ports:
      - "127.0.0.1:5050:80"
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: doublea-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://doublea:${POSTGRES_PASSWORD}@postgres:5432/doublea_commerce?schema=public&connection_limit=10&pool_timeout=10&connect_timeout=5&socket_timeout=10&application_name=doublea_api
      DIRECT_DATABASE_URL: postgresql://doublea:${POSTGRES_PASSWORD}@postgres:5432/doublea_commerce?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      JWT_ACCESS_EXPIRES: 15m
      JWT_REFRESH_EXPIRES: 7d
      API_PORT: 3001
      NODE_ENV: production
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      LOCATION_ENCRYPTION_KEY: ${LOCATION_ENCRYPTION_KEY:?LOCATION_ENCRYPTION_KEY is required}
      LOCATION_HMAC_SECRET: ${LOCATION_HMAC_SECRET:?LOCATION_HMAC_SECRET is required}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      ADMIN_URL: http://localhost:3000
      MOBILE_API_URL: http://localhost:3001
    ports:
      - "3001:3001"
    volumes:
      - uploads_data:/app/apps/api/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/health/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
  uploads_data:
