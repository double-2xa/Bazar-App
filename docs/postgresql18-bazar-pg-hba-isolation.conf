# PostgreSQL 18 connection isolation for the Bazar application roles
#
# This is a pg_hba.conf fragment, NOT SQL. Install it on the PostgreSQL server.
# Put this entire block BEFORE every broad/general host or local rule because
# PostgreSQL uses the first matching pg_hba.conf record.
#
# Result:
#   Bazar, bazar_muteren and bazar_read may connect to:
#       nicepricebazar-ota-db
#   The same roles are rejected from every other database in this cluster.
#
# TCP with TLS: allow only the application database, then reject all others.
hostssl  nicepricebazar-ota-db  Bazar,bazar_muteren,bazar_read  0.0.0.0/0  scram-sha-256
hostssl  nicepricebazar-ota-db  Bazar,bazar_muteren,bazar_read  ::/0       scram-sha-256
hostssl  all                    Bazar,bazar_muteren,bazar_read  0.0.0.0/0  reject
hostssl  all                    Bazar,bazar_muteren,bazar_read  ::/0       reject

# Reject unencrypted TCP for these roles, including generic rules later below.
hostnossl all                    Bazar,bazar_muteren,bazar_read  0.0.0.0/0  reject
hostnossl all                    Bazar,bazar_muteren,bazar_read  ::/0       reject

# Unix-domain socket connections made directly on a Linux PostgreSQL server.
local    nicepricebazar-ota-db  Bazar,bazar_muteren,bazar_read             scram-sha-256
local    all                    Bazar,bazar_muteren,bazar_read             reject

# Installation and verification
# -----------------------------
# 1. Locate the active file from pgAdmin Query Tool:
#      SHOW hba_file;
#
# 2. Back up that file, paste this block before broad rules, then validate it:
#      SELECT line_number, type, database, user_name, address, auth_method, error
#      FROM pg_catalog.pg_hba_file_rules
#      ORDER BY line_number;
#    Do not reload while any row in the added block has a non-NULL error.
#
# 3. Reload PostgreSQL configuration (no restart is normally required):
#      SELECT pg_catalog.pg_reload_conf();
#
# 4. Make four NEW connections for EACH of the three roles:
#      nicepricebazar-ota-db  -> must connect over SSL
#      postgres              -> must fail
#      doublea_website_ota   -> must fail
#      any other database    -> must fail
#
# Important: an already-open connection is not disconnected by an HBA reload.
# Close old sessions before testing. A database still appearing in pgAdmin's
# tree is not proof that the selected role can connect to it.
